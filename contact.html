<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Portfolio</a>
            <button class="nav-toggle" onclick="toggleMobileMenu()">☰</button>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="resume.html" class="nav-link">Resume</a></li>
                <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </nav>
    <main class="main">
        <section class="contact-section">
            <h1 class="fade-in-up">Let's Connect</h1>
            <p class="contact-subtitle fade-in-up delay-1">Medical Tech Collaborations | NEET PG Study | Web Development</p>
            
            <form id="contactForm" class="contact-form fade-in-up delay-2">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Your Name *" required>
                    <span class="error-message" id="nameError"></span>
                    <div class="input-focus"></div>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Your Email *" required>
                    <span class="error-message" id="emailError"></span>
                    <div class="input-focus"></div>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="Your Message *" rows="6" required></textarea>
                    <span class="error-message" id="messageError"></span>
                    <div class="input-focus"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-large pulse-animation">
                    <span>Send Message</span>
                    <div class="btn-ripple"></div>
                </button>
            </form>
            <div id="formSuccess" class="success-message">
                <svg viewBox="0 0 24 24" class="checkmark"><path d="M20 6L9 17l-5-5"/></svg>
                Thank you! Message sent successfully. I'll respond within 24 hours.
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
